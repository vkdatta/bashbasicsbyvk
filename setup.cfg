[metadata]
name = bashbasicsbyvk
version = 0.0.120
description = Interactive Bash terminal file manager and developer toolkit
author = Vk Datta
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/vkdatta/bashbasicsbyvk
license = MIT
keywords =
    bash,
    terminal-file-manager,
    command-line-file-manager,
    tui-file-manager,
    termux,
    linux,
    file-management,
    file-organizer,
    file-search,
    file-browser,
    bash-utilities,
    terminal-productivity,
    file-sharing,
    encrypted-file-transfer,
    file-backup,
    developer-tools,
    shell-utilities,
    bashbasicsbyvk

python_requires = >=3.6
packages = find:

[options.packages.find]
where = .

[options]
python_requires = >=3.6

[classifiers]
Programming Language :: Python :: 3
License :: OSI Approved :: MIT License
Operating System :: OS Independent
